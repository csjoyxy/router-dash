name: RouterDash
options:
  bundleIdPrefix: com.csjoyxy
targets:
  RouterDash:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.csjoyxy.routerdash
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.csjoyxy.routerdash
