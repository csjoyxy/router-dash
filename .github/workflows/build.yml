name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project RouterDash.xcodeproj \
            -scheme RouterDash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/RouterDash.app Payload/
          zip -r RouterDash.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RouterDash-ipa
          path: RouterDash.ipa
